[package]
name = "bevy_ecs_ldtk"
description = "An ECS-friendly ldtk plugin for bevy."
version = "0.15.0"
edition = "2021"
authors = ["Trevor Lovell <trevorlovelldesign@gmail.com>"]
repository = "https://github.com/Trouv/bevy_ecs_ldtk"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "ldtk", "game", "gamedev", "map-editor"]
categories = ["game-development"]
exclude = ["assets/*", "repo/*", "scripts/*"]

[workspace]
members = ["macros"]

[dependencies]
bevy_ecs_ldtk_macros = { version = "0.15.0", optional = true, path = "macros" }
bevy_ecs_tilemap = { path = "../bevy_ecs_tilemap", version = "0.19.0", default-features = false }
bevy = { version = "0.20.0", default-features = false, features = [
    "bevy_sprite",
] }
derive-getters = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
thiserror = "2.0"
paste = "1.0"
derive_more = { version = "2.1.1", features = ["constructor", "try_into"] }

[dev-dependencies]
bevy = "0.20.0"
# Bevy 0.20 migration: https://github.com/avianphysics/avian/pull/1070
avian2d = { git = "https://github.com/avianphysics/avian", rev = "34c9b008d2f40638a953d9218db48d54f661365d" }
fake = { version = "5.1", features = ["uuid"] }
rand = "0.10"
# Bevy 0.20 migration: https://github.com/jakobhellermann/bevy-inspector-egui/pull/324
bevy-inspector-egui = { git = "https://github.com/taboky-dev/bevy-inspector-egui", rev = "6c4689637f289647ecad5897da35c29032fcc086" }

[features]
default = ["derive", "render", "internal_levels"]
derive = ["bevy_ecs_ldtk_macros"]
atlas = ["bevy_ecs_tilemap/atlas"]
render = ["bevy_ecs_tilemap/render"]
internal_levels = []
external_levels = []

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "platformer"
path = "examples/platformer/main.rs"

[[example]]
name = "field_instances"
path = "examples/field_instances/main.rs"

[[example]]
name = "collectathon"
path = "examples/collectathon/main.rs"
